Dialog.FollowTooltip="Follow the cursor while it stays inside the captured region."
Dialog.SmoothingSpeed="Smoothing Speed"
Dialog.FollowSource="Follow"
Dialog.FollowSource.Screen="The mouse across the selected screen"
Dialog.FollowSource.Preview="The pointer over the OBS preview"
Dialog.FollowSourceTooltip="Screen: the desktop cursor drives the shot, mapped across the whole selected monitor. Right when the scene is a capture of that screen.

Preview: aim by pointing at the canvas in OBS's own preview panel. Right when the scene is video or images. Tracks the preview as you resize, zoom or scroll it. The focal point holds when the pointer leaves the canvas, and returns to centre when OBS is not the active window."
Dialog.CenterCursorUntilEdge="Keep cursor centered until the capture reaches an edge"
Dialog.CenterCursorUntilEdgeTooltip="Maps the full captured monitor to the full captured scene content, which improves ultrawide tracking and clamps only when an edge is reached."
Dialog.MouseIdleTimeout="Pause following after idle"
Dialog.MouseIdleTimeoutTooltip="Freeze the current view after the mouse has not moved for this long. Following resumes when the mouse moves."
Dialog.Disabled="Disabled"
Dialog.NormaliseFollowRange="Use the full pan range at every zoom level"
Dialog.NormaliseFollowRangeTooltip="Maps the pointer's whole travel onto the framing that can actually be reached at the current zoom.

Without it the pointer picks a scene position and the framing clamp refuses most of them, so only a fraction of the pointer's range moves anything - about 7% at the small zoom the wiggle asks for, 50% at 2x, 75% at 4x. The rest sits pinned against a canvas edge.

Leave it off for a screen capture, where the zoom has to land on the real cursor rather than on a proportional position."
Dialog.PortraitCover="Portrait cover, auto-scale to fill vertical canvases"
Dialog.PortraitCoverTooltip="When the canvas is taller than wide, scale the capture so it fills the canvas with no top / bottom gaps."
Dialog.ShowCursorHalo="Show click halo"
Dialog.ShowCursorHaloTooltip="Flash a halo at the click position. Continuous cursor halos are intentionally disabled for accuracy and lower overhead."
Dialog.ShowOnlyOnClick="Show only on click"
Dialog.ShowOnlyOnClickTooltip="When enabled, the halo flashes at the click position instead of following the cursor continuously."
Dialog.HaloSize="Halo Size"
Dialog.RingThickness="Ring Thickness"
Dialog.Color="Color"
Dialog.EnableDebugLogging="Enable debug logging"
Dialog.SourcesHelp="<b>Check</b> sources to include in the zoom effect.<br><b>Unchecked</b> sources stay fixed, such as a camera overlay or a watermark.<br>New sources are unchecked until you opt them in."
Dialog.StatusTip="Tip: Select the monitor that should drive the scene movement."
