Dialog.PluginDisabledStatus="MotionCraft disabled. Sources restored; the toggle hotkey still works."
Dialog.PluginStartsOffHelp="MotionCraft starts switched off each time OBS launches. Bind a hotkey below to switch it on and off without opening this window."
