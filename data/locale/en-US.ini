Dialog.HotkeysEnabled="Enable hotkeys"
Dialog.HotkeysEnabledTooltip="Master switch for every MotionCraft hotkey, including the Follow Mouse toggle. When off, no keyboard hook is installed and nothing is intercepted. Bindings are kept and take effect again when you switch it back on."
Dialog.ZoomLevels.Help="Assign a hotkey to each zoom level. Pressing a level's key zooms to that level; pressing the same key again returns to normal. Pressing a different level's key while zoomed moves straight to that level."
Dialog.ZoomLevels.Level="Level"
Dialog.ZoomLevels.AnimateInTooltip="Time to zoom in to this level from normal."
Dialog.ZoomLevels.AnimateOutTooltip="Time to zoom out from this level back to normal."
Dialog.ZoomLevels.ClearHotkeyTooltip="Clear this level's hotkey"
Dialog.ZoomLevels.TimingHelp="Animate In and Out are measured from normal, so moving between two levels takes the difference between their times: going from level 1 to level 3 takes Animate In of 3 minus Animate In of 1. Every move eases in and out, and changing level mid-zoom carries the current speed through rather than restarting."

Dialog.Wiggle.Enable="Enable wiggle"
Dialog.Wiggle.EnableTooltip="Start the handheld drift on the sources ticked under Sources. It runs whether or not the scene is zoomed, and rides on top of any zoom."
Dialog.Wiggle.Help="Adds a handheld-camera drift to the checked sources. The whole selection moves as one camera, so a composed scene stays composed. Sources are enlarged just enough that the drift cannot pull the canvas background into view."
Dialog.Wiggle.Section.Ranges="Ranges"
Dialog.Wiggle.Min="Min"
Dialog.Wiggle.Mid="Midpoint"
Dialog.Wiggle.Max="Max"
Dialog.Wiggle.Position="Position"
Dialog.Wiggle.PositionTooltip="How far the camera drifts from centre, in canvas pixels."
Dialog.Wiggle.Rotation="Rotation"
Dialog.Wiggle.RotationTooltip="How far the camera rolls. The whole selection turns about the canvas centre, as tilting a real camera would."
Dialog.Wiggle.Scale="Scale"
Dialog.Wiggle.ScaleTooltip="How much the shot breathes in and out, as a percentage of its size."
Dialog.Wiggle.Speed="Speed"
Dialog.Wiggle.SpeedTooltip="How fast the drift moves through its pattern."
Dialog.Wiggle.Smoothing="Smoothing"
Dialog.Wiggle.SmoothingTooltip="How long the drift takes to ease onto each newly drawn value. Short is quick and eager, long is soft and unhurried."
Dialog.Wiggle.Seed="Seed"
Dialog.Wiggle.SeedTooltip="Different seeds give different drift patterns. The same seed always produces the same motion."
Dialog.Wiggle.RangeHelp="Every parameter is redrawn twice a second from a bell curve centred on its midpoint, kept inside Min and Max, and then eased onto over the smoothing time - which is what gives the motion the hesitation and hurry of a real hand. Set Min and Max to the same value to hold a parameter steady."
