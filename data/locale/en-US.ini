Dialog.PluginEnabled="Enable MotionCraft"
Dialog.PluginEnabledTooltip="Turn the whole plugin on or off. Takes effect immediately, without Apply. Off unwinds any zoom and wiggle, puts every source back the way it was, and stops listening for everything except the toggle key below. MotionCraft starts off every time OBS launches, so nothing is touched until you switch it on."
