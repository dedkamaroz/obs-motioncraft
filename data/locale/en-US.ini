Dialog.ZoomLevels.Help="Assign a hotkey to each zoom level. Pressing a level's key zooms to that level; pressing the same key again returns to normal. Pressing a different level's key while zoomed moves straight to that level."
Dialog.ZoomLevels.Level="Level"
Dialog.ZoomLevels.AnimateInTooltip="Time to zoom in to this level from normal."
Dialog.ZoomLevels.AnimateOutTooltip="Time to zoom out from this level back to normal."
Dialog.ZoomLevels.ClearHotkeyTooltip="Clear this level's hotkey"
Dialog.ZoomLevels.TimingHelp="Animate In and Out are measured from normal, so moving between two levels takes the difference between their times: going from level 1 to level 3 takes Animate In of 3 minus Animate In of 1. Every move eases in and out, and changing level mid-zoom carries the current speed through rather than restarting."
